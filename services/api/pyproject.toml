[project]
name = "neuroforge-api"
version = "0.1.0"
description = "Discovery API for the NeuroForge model and dataset registry."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "neuroforge",
    "uvicorn>=0.32",
]

[tool.uv.sources]
neuroforge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

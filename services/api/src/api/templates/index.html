<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroForge</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --paper: #f3efe6;
      --card: #fffdf8;
      --line: #d9d1c3;
      --signal: #0f6e56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      background: var(--paper);
      color: var(--ink);
    }
    header, main { width: min(960px, calc(100% - 2rem)); margin: 0 auto; }
    header { padding: 3.5rem 0 1rem; }
    .mark { letter-spacing: 0.14em; text-transform: uppercase; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.78rem; color: var(--signal); }
    h1 { font-size: clamp(2.6rem, 6vw, 4.5rem); line-height: 0.95; font-weight: 560; margin: 0.4rem 0; }
    .lede { font-size: 1.2rem; max-width: 38rem; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; padding-bottom: 4rem; }
    .card { background: var(--card); border: 1px solid var(--line); padding: 1.1rem 1.2rem 1.3rem; }
    .kicker { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--signal); margin: 0; }
    h2 { margin: 0.3rem 0 0.6rem; font-size: 1.5rem; }
    p { line-height: 1.45; }
    code { display: block; margin-top: 0.8rem; padding: 0.7rem; background: #efeae1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <p class="mark">NeuroForge</p>
    <h1>Models that cannot leak the subject.</h1>
    <p class="lede">A Python library for BCI and neuro-AI. Splits are computed on recording identity before any window is cut, and the smoke trainer runs with no dataset download.</p>
  </header>
  <main class="grid">
    <!--CARDS-->
  </main>
</body>
</html>

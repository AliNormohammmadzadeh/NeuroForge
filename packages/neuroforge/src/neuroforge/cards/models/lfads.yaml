slug: lfads
name: LFADS
architecture: sequential variational autoencoder
task: latent_dynamics
modalities: [Spikes]
param_count: 0
summary: >
  Bidirectional encoder, initial-condition posterior, and a Poisson generator.
  Coordinated dropout is applied to the encoder input. Train the smoke recipe
  before pointing it at a DANDI NWB file.
train_command: uv run neuroforge train --model lfads --steps 2
inputs: Binned spike counts of shape (trials, time, neurons).
usage: >
  Use it to infer a low-dimensional initial condition and Poisson rates.
  Score held-out bins with co-bps. Do not score it with classification accuracy.
license: Apache-2.0
benchmarks: []

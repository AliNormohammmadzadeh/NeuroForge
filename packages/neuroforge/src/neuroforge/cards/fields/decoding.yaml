slug: decoding
name: Choosing a decoder
kicker: Algorithms
hue: "#9ddec4"
retrieved_on: "2026-10-03"
snapshot_source: Project recipes
summary: >
  Start with the algorithm the field already trusts, then the model this
  repository can train. For motor imagery that is CSP or a Riemannian
  classifier, then EEG-Conformer or a causal TCN. For spikes it is GPFA, then
  LFADS. For a connectome it is a correlation matrix, then BrainGNN. The
  cortex view labels each of these. A label marked as a reference is not
  trained by neuroforge train.

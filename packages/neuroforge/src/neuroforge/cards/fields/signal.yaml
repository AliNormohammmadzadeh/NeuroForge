slug: signal
name: From voltage to a trial
kicker: Start with the signal
hue: "#d7c4a3"
retrieved_on: "2026-10-03"
snapshot_source: Project recipes
summary: >
  A decoder never sees the headset file directly. EEG is filtered, rereferenced,
  cut into trials, and scaled with statistics from the training fold. Spikes
  are binned. fMRI becomes a connectivity matrix. Do that work in a fixed
  order and write the config hash into the cache, or a later run will silently
  mix two preprocessings.
